name: Experiment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch
        run: python -m pip install -r requirements.txt
      - name: Run all experiment checks
        run: python scripts/check_all.py
      - name: Exercise live output slots
        run: python experiments/hat_minkron/example_live.py
