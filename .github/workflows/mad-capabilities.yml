name: MAD capability research
on:
  push:
    branches: ['research/mad-capabilities']
    paths: ['.github/workflows/mad-capabilities.yml', 'experiments/mad_capabilities/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  loops:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        task: [compression, selective_copy, recall]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib
      - name: Verify bridge, causality and checkpoints
        run: python -m unittest experiments.mad.test_protocol -v
      - name: Calibrate then rerun loops with equal optimizer searches
        run: python -u -m experiments.mad_capabilities.screen --task ${{ matrix.task }} --out results/${{ matrix.task }}
      - name: Render measured curves
        run: python -m experiments.mad_capabilities.report --directory results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mad-loops-${{ matrix.task }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        size: [1000000, 5000000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib
      - name: Verify state credit and exact continuation
        run: |
          python -m unittest experiments.structured_state.test_adapter -v
          python -m experiments.structured_state.check_native --sanitize
      - name: Calibrate and rerun final, head and state supervision
        run: python -u -m experiments.mad_capabilities.state_campaign --size ${{ matrix.size }} --budget 1000000 --out results/state_${{ matrix.size }}.json
      - name: Render measured state results
        run: python -m experiments.mad_capabilities.report --directory results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mad-state-${{ matrix.size }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
  evidence:
    needs: [loops, state]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: mad-*
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 43787250957
          github-token: ${{ github.token }}
          pattern: mad-calibration-*
          path: evidence/calibration
          merge-multiple: true
      - run: python -m experiments.mad_capabilities.report --directory evidence
      - name: Include compact reproduction source
        run: |
          cp -r experiments/mad_capabilities evidence/reproduction
          cp experiments/mad/README.md evidence/MAD_Protocol.md
          find evidence -type d -name __pycache__ -prune -exec rm -r {} +
      - uses: actions/upload-artifact@v4
        with:
          name: SHoEbox_MAD_Capability_Research
          path: evidence/
          retention-days: 90
          if-no-files-found: error
