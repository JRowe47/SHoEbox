name: EXP01 query readout

on:
  push:
    paths: ['experiments/query_readout/**', 'multiscale/**', '.github/workflows/query-readout.yml']
  pull_request:
    paths: ['experiments/query_readout/**', 'multiscale/**', '.github/workflows/query-readout.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query-readout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest experiments.query_readout.test_adapter -v
      - run: python -m experiments.query_readout.check_native
